# Log-Rotation und Haertung, 2026-10-18 (Gutachten Traefik-Dienste, Punkte 6 und 7). Erzeugt von
# /opt/gateway/haertung-override.py. Rueckbau: Datei loeschen und `docker compose up -d`.
services:
  drysim:   # Stufe: nginx
    logging: {"driver": "json-file", "options": {"max-size": "10m", "max-file": "3"}}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/run", "/tmp"]
    mem_limit: "128m"
