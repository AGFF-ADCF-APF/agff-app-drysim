# Alter Standort nach dem Umzug: nur noch sw.js (meldet den alten Service Worker ab), alles andere 301 auf die neue Adresse.
# Traefik schneidet /heureka (bzw. /drysim für sw.js) ab; $request_uri enthält Pfad und Abfrage (?wetter=, ?code=, ?niveau=).
server {
    listen 80;
    server_name _;
    location = /sw.js {
        root /usr/share/nginx/alt;
        types { }
        default_type "text/javascript; charset=utf-8";
        add_header Cache-Control "no-cache" always;
    }
    location / {
        return 301 https://app.graswachstum.ch/heureka$request_uri;
    }
}
