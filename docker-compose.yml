services:
  drysim:
    build: .
    container_name: agff-drysim
    restart: unless-stopped
    networks:
      - web-netzwerk
    labels:
      - "traefik.enable=true"
      # Heureka (bis 11.2026 «Silage-Simulator» unter /drysim)
      - "traefik.http.routers.heureka.rule=Host(`apps.graswachstum.ch`) && PathPrefix(`/heureka`)"
      - "traefik.http.routers.heureka.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le-http}"
      - "traefik.http.routers.heureka.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      # /heureka ohne Schrägstrich umleiten, sonst stimmen die relativen Pfade nicht
      - "traefik.http.middlewares.heureka-slash.redirectregex.regex=^(https?://[^/]+/heureka)$$"
      - "traefik.http.middlewares.heureka-slash.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.heureka-slash.redirectregex.permanent=true"
      - "traefik.http.middlewares.heureka-strip.stripprefix.prefixes=/heureka"
      - "traefik.http.routers.heureka.middlewares=heureka-slash,heureka-strip"
      - "traefik.http.routers.heureka.service=heureka"
      - "traefik.http.services.heureka.loadbalancer.server.port=80"
      # Alte Adresse /drysim/… dauerhaft auf /heureka/… umleiten (Pfad und ?wetter=/?code= bleiben erhalten)
      - "traefik.http.routers.drysim-alt.rule=Host(`apps.graswachstum.ch`) && PathPrefix(`/drysim`)"
      - "traefik.http.routers.drysim-alt.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le-http}"
      - "traefik.http.routers.drysim-alt.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.middlewares.drysim-zu-heureka.redirectregex.regex=^(https?://[^/]+)/drysim/?(.*)$$"
      - "traefik.http.middlewares.drysim-zu-heureka.redirectregex.replacement=$${1}/heureka/$${2}"
      - "traefik.http.middlewares.drysim-zu-heureka.redirectregex.permanent=true"
      - "traefik.http.routers.drysim-alt.middlewares=drysim-zu-heureka"
      - "traefik.http.routers.drysim-alt.service=heureka"
networks:
  web-netzwerk:
    external: true
